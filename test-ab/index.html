<!doctype html>
<html lang="ru" data-skin="ab">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F3F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D0F11" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="E46">
<meta name="description" content="Бортжурнал BMW E46: регламент ТО под ваш мотор, журнал замен, слабые места.">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Бортжурнал E46</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600&family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one calm phone-width column. Monochrome "technical drawing" world; the only colour is the E46 cluster's red-orange glow in the odometer */
:root{
  --bg:#F2F3F4; --surface:#FFFFFF; --ink:#101317; --muted:#6A727C; --line:#E1E4E7; --soft:#EBEDEF;
  --glow:#FF5B1F; --lcd:#0C0D0F; --lcd-dim:#3A1E14; --lcd-text:#C9B7AE;
  --ok:#2F7D51; --soon:#B26A00; --late:#CF3A2A;
  --ok-soft:#E3F1E8; --soon-soft:#F9EDD8; --late-soft:#F9E3DF;
  --f-display:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0F11; --surface:#16191C; --ink:#ECEEF0; --muted:#8C949D; --line:#24282D; --soft:#1D2125;
  --glow:#FF6A2E; --lcd:#060708; --lcd-dim:#33190F; --lcd-text:#C9B7AE;
  --ok:#5DC28A; --soon:#E9A642; --late:#F06A5B;
  --ok-soft:#14291D; --soon-soft:#2E230F; --late-soft:#331815; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D0F11; --surface:#16191C; --ink:#ECEEF0; --muted:#8C949D; --line:#24282D; --soft:#1D2125;
  --glow:#FF6A2E; --lcd:#060708; --lcd-dim:#33190F; --lcd-text:#C9B7AE;
  --ok:#5DC28A; --soon:#E9A642; --late:#F06A5B;
  --ok-soft:#14291D; --soon-soft:#2E230F; --late-soft:#331815; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);padding-inline:16px;-webkit-font-smoothing:antialiased}
main{max-width:600px;margin:0 auto;padding-block:28px 120px;display:flex;flex-direction:column;gap:32px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:inherit}
h1{font:300 52px/0.95 var(--f-display);letter-spacing:-.035em}
h2{font:500 11.5px/1.3 var(--f-body);text-transform:uppercase;letter-spacing:.16em;color:var(--muted)}
h3{font:500 19px/1.25 var(--f-body);letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.section{display:flex;flex-direction:column;gap:12px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.link{background:none;border:0;padding:0;color:var(--ink);font-size:13px;font-weight:500;border-bottom:1px solid var(--line)}
.link:hover{border-color:var(--ink)}

/* hero */
.hero{display:flex;flex-direction:column;gap:18px}
.car-line{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.car-line > div{min-width:0;display:flex;flex-direction:column;gap:10px}
.eyebrow{font:500 11.5px var(--f-body);text-transform:uppercase;letter-spacing:.16em;color:var(--muted)}
.meta{color:var(--muted);font:500 13px var(--f-mono);letter-spacing:.01em}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:13px;white-space:nowrap}
.ghost:hover{border-color:var(--ink)}

/* the drawing */
.art{position:relative;margin-top:6px;padding-bottom:46px;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
.art:active{cursor:grabbing}
.turn-stage{position:relative;width:100%;aspect-ratio:1000/330;max-width:100%}
.turn-img{position:absolute;inset:0;background:var(--ink);-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;opacity:0;transition:opacity .32s ease}
.turn-img.on{opacity:.92}
@media (prefers-reduced-motion:reduce){.turn-img{transition:none}}
.art::before{content:"";position:absolute;left:-12px;right:-12px;top:calc((100% - 46px) * .9636);height:1px;background:linear-gradient(90deg,transparent,var(--line) 12%,var(--line) 88%,transparent)}
.dim{position:absolute;display:flex;align-items:center;gap:8px;font:500 10.5px var(--f-mono);color:var(--muted);letter-spacing:.04em;white-space:nowrap;transition:opacity .3s,left .3s,right .3s}
.dim::before,.dim::after{content:"";flex:1;height:1px;background:var(--muted);opacity:.45}
.dim{border-left:1px solid color-mix(in srgb,var(--muted) 60%,transparent);border-right:1px solid color-mix(in srgb,var(--muted) 60%,transparent);height:11px}
.dim-a{bottom:24px}
.dim-b{bottom:2px}
.dim.off{opacity:0}
.dim span{flex:none}
.turn-ctl{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:4px}
.turn-ctl button{background:none;border:1px solid var(--line);border-radius:50%;width:30px;height:30px;font:400 16px/1 var(--f-mono);color:var(--muted);display:grid;place-items:center;padding:0}
.turn-ctl button:hover{color:var(--ink);border-color:var(--ink)}
.turn-name{font:500 11px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);min-width:15ch;text-align:center}
.turn-dots{display:flex;gap:5px;justify-content:center;margin-top:8px}
.turn-dots i{width:5px;height:5px;border-radius:50%;background:var(--line)}
.turn-dots i.on{background:var(--ink)}

/* odometer */
.lcd{display:flex;align-items:center;gap:14px;background:var(--lcd);border:0;border-radius:18px;padding:16px 20px;text-align:left;width:100%;color:var(--lcd-text);position:relative;overflow:hidden}
.lcd::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 140% at 15% 50%,color-mix(in srgb,var(--glow) 16%,transparent),transparent 60%);pointer-events:none}
.lcd .lbl{font:500 10px var(--f-mono);letter-spacing:.2em;color:var(--glow);opacity:.7;writing-mode:vertical-rl;transform:rotate(180deg)}
.lcd .digits{font:500 34px/1 var(--f-mono);letter-spacing:.08em;color:var(--glow);text-shadow:0 0 14px color-mix(in srgb,var(--glow) 60%,transparent);font-variant-numeric:tabular-nums}
.lcd .digits .lead{color:var(--lcd-dim);text-shadow:none}
.lcd .unit{font:500 14px var(--f-mono);color:var(--glow);opacity:.75;align-self:flex-end;margin-bottom:3px}
.lcd .hint{margin-left:auto;font-size:12.5px;color:var(--lcd-text);opacity:.7;position:relative;z-index:1}
.lcd:hover .hint{opacity:1}

/* health strip */
.health{display:flex;flex-direction:column;gap:10px}
.strip{display:flex;gap:3px;height:6px}
.strip i{border-radius:3px;background:var(--line);min-width:6px}
.strip .late{background:var(--late)} .strip .soon{background:var(--soon)} .strip .ok{background:var(--ok)}
.tally{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.tally b{color:var(--ink);font:500 13px var(--f-mono)}
.pill{display:inline-flex;align-items:center;gap:7px}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--line)}
.s-late .dot,.dot.s-late{background:var(--late)} .s-soon .dot,.dot.s-soon{background:var(--soon)} .s-ok .dot,.dot.s-ok{background:var(--ok)} .s-cond .dot,.dot.s-cond{background:transparent;border:1.5px solid var(--muted)}

.banner{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px dashed var(--muted);border-radius:16px;padding:14px 16px;font-size:14px}
.banner p{flex:1 1 220px;min-width:0;color:var(--muted)}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:11px 20px;font-weight:500;font-size:14.5px}
.btn:hover{opacity:.88}
.btn:disabled{opacity:.45;cursor:default}
.btn.wide{width:100%}
.btn.quiet{background:transparent;color:var(--ink);border:1px solid var(--line)}

/* rows */
.list{background:var(--surface);border-radius:18px;overflow:hidden}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--soft);padding:15px 16px;align-items:center}
.row:first-child{border-top:0}
button.row:hover{background:var(--soft)}
.row .dot{grid-row:1}
.row .name{font-weight:500;min-width:0}
.row .left{font:500 12.5px var(--f-mono);text-align:right;white-space:nowrap}
.row .sub{grid-column:2 / -1;font-size:12.5px;color:var(--muted)}
.bar{grid-column:2 / -1;height:2px;border-radius:1px;background:var(--soft);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%}
.s-ok .bar i{background:var(--ok)} .s-soon .bar i{background:var(--soon)} .s-late .bar i{background:var(--late)}
.s-late .left{color:var(--late)} .s-soon .left{color:var(--soon)} .s-ok .left{color:var(--ink)} .s-none .left,.s-cond .left{color:var(--muted)}
.row.plain{grid-template-columns:1fr;cursor:default}
.row.plain .sub{grid-column:1}
.grp{font:500 11px var(--f-body);text-transform:uppercase;letter-spacing:.16em;color:var(--muted);padding:18px 16px 8px;border-top:1px solid var(--soft)}
.grp:first-child{border-top:0;padding-top:14px}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 13px;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* shopping */
.shop{background:var(--surface);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.shop ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;font-size:14px}
.shop li{display:grid;grid-template-columns:18px 1fr;gap:10px;color:var(--muted)}
.shop li::before{content:"";width:14px;height:14px;border:1.5px solid var(--line);border-radius:4px;margin-top:3px}
.shop li b{font-weight:500;color:var(--ink)}

/* info */
.specs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--surface);border-radius:18px;overflow:hidden}
.spec{padding:13px 16px;min-width:0;border-top:1px solid var(--soft)}
.spec:nth-child(odd){border-right:1px solid var(--soft)}
.spec:nth-child(-n+2){border-top:0}
.spec span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.spec b{display:block;font-weight:500;font-size:14.5px;margin-top:3px}
.spec.full{grid-column:1 / -1;border-right:0}
details.card{background:var(--surface);border-radius:16px}
details.card summary{list-style:none;cursor:pointer;padding:15px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:500}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"+";font:300 22px/1 var(--f-body);color:var(--muted)}
details.card[open] summary::after{content:"−"}
.card-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--muted)}
.card-body b{color:var(--ink);font-weight:500}
.card-body ol,.card-body ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.stack{display:flex;flex-direction:column;gap:8px}
.ask{background:var(--surface);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.ask textarea{font:15px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid transparent;border-radius:12px;padding:12px;min-height:80px;resize:vertical;width:100%}
.answer{white-space:pre-wrap;font-size:14px;line-height:1.6;background:var(--bg);border-radius:12px;padding:14px}
.qs{display:flex;gap:6px;flex-wrap:wrap}

/* item sheet */
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0}
.block{display:flex;flex-direction:column;gap:5px;font-size:14.5px}
.block b{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:500}
.tip{border-left:2px solid var(--glow);padding:2px 0 2px 14px;font-size:14px;color:var(--muted)}
.status-box{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.status-box.s-ok{background:var(--ok-soft)} .status-box.s-soon{background:var(--soon-soft)} .status-box.s-late{background:var(--late-soft)} .status-box.s-none,.status-box.s-cond{background:var(--soft)}
.status-box b{font:500 17px var(--f-mono)}
.diy{display:inline-flex;gap:3px;vertical-align:middle;margin-left:8px}
.diy i{width:12px;height:4px;border-radius:2px;background:var(--line)}
.diy i.on{background:var(--ink)}

/* journal */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--soft);border-radius:18px;overflow:hidden}
.stat{background:var(--surface);padding:14px 16px;min-width:0}
.stat b{display:block;font:500 18px/1.2 var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:12px;color:var(--muted)}
.entry{display:grid;grid-template-columns:auto 1fr auto;gap:2px 14px;padding:14px 16px;border:0;border-top:1px solid var(--soft);align-items:baseline;width:100%;text-align:left;background:none}
.entry:first-child{border-top:0}
.entry:hover{background:var(--soft)}
.entry .d{font:500 12.5px var(--f-mono);color:var(--muted);white-space:nowrap}
.entry .t{font-weight:500;min-width:0}
.entry .c{font:500 13.5px var(--f-mono);white-space:nowrap}
.entry .k{grid-column:2 / -1;font-size:12.5px;color:var(--muted)}
.empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:14px}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:10;padding-inline:16px;pointer-events:none}
nav.tabs .in{display:flex;max-width:420px;width:100%;background:color-mix(in srgb,var(--surface) 82%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:22px;padding:5px;pointer-events:auto;box-shadow:0 10px 30px rgba(0,0,0,.08)}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:0;padding:7px 2px 6px;font-size:11px;color:var(--muted);border-radius:17px}
nav.tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--ink);background:var(--soft);font-weight:500}

/* sheet */
#scrim{position:fixed;inset:0;background:rgba(6,8,10,.45);z-index:20;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;display:flex;justify-content:center;max-height:90%}
#sheet .in{background:var(--surface);width:100%;max-width:600px;border-radius:24px 24px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));overflow-y:auto;display:flex;flex-direction:column;gap:16px;animation:up .24s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(28px);opacity:.5}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#sheet .in{animation:none}}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet-head > div{display:flex;flex-direction:column;gap:6px;min-width:0}
.x{background:var(--soft);border:0;border-radius:50%;width:32px;height:32px;font-size:18px;line-height:1;flex:none}
form{display:flex;flex-direction:column;gap:14px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fields .full{grid-column:1 / -1}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea{font:15px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid transparent;border-radius:12px;padding:11px 12px;width:100%;min-width:0}
label.f input:focus,label.f select:focus{border-color:var(--ink);outline:0}
label.f input.num{font-family:var(--f-mono)}
label.cb{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted)}
label.cb input{width:18px;height:18px;accent-color:var(--ink);margin-top:2px;flex:none}
.picks{display:flex;flex-direction:column;max-height:260px;overflow-y:auto;border-radius:12px;background:var(--bg)}
.picks label{display:flex;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line);font-size:14px}
.picks label:first-child{border-top:0}
.picks input{width:18px;height:18px;accent-color:var(--ink);flex:none}
.note{font-size:13px;color:var(--muted)}
.foot{font-size:12px;color:var(--muted);text-align:center;text-wrap:balance}
.err{color:var(--late);font-size:13px}
.danger{background:none;border:0;color:var(--late);font-size:14px;padding:4px 0}
.loading{padding:80px 0;text-align:center;color:var(--muted)}
.vinbox{background:var(--surface);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.vinbox input{text-transform:uppercase;letter-spacing:.08em;font-size:16px!important}
.vin-card{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--soft);padding-top:12px}
.vin-card b{font:500 17px var(--f-body)}
@media (max-width:420px){h1{font-size:44px}.lcd .digits{font-size:28px}.fields{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.stat b{font-size:15px}.dim{font-size:9.5px}}

/* ===== Test skins (set by <html data-skin>): "a" = E46 cockpit, "ab" = My BMW layout with the E46 cockpit on top. Both dark by design. ===== */
:root[data-skin="a"]{
  --bg:#0A0A0B; --surface:#141416; --ink:#EFE2DA; --muted:#8F7F77; --line:#2B2B2F; --soft:#1C1C1F;
  --glow:#FF5B1F; --lcd:#050506; --lcd-dim:#33190F; --lcd-text:#C9B7AE;
  --ok:#3BC46C; --soon:#F2A63A; --late:#FF4B3A; --ok-soft:#10261A; --soon-soft:#2E220E; --late-soft:#341512;
  --chrome:#3A3A40; --act:#FF5B1F; --act-ink:#160A05;
  --f-display:'Golos Text','Onest',system-ui,sans-serif; --f-body:'Golos Text','Onest',system-ui,sans-serif;
  color-scheme:dark;
}
:root[data-skin="ab"]{
  --bg:#0F1113; --surface:#1A1D21; --ink:#F1F3F5; --muted:#8E959E; --line:#2A2F35; --soft:#22262B;
  --glow:#FF5B1F; --lcd:#060708; --lcd-dim:#33190F; --lcd-text:#C9B7AE;
  --ok:#4CC27E; --soon:#F0A63A; --late:#F0574B; --ok-soft:#13281C; --soon-soft:#2D230F; --late-soft:#331816;
  --chrome:#343A41; --act:#1C69D4; --act-ink:#FFFFFF;
  --f-display:'Golos Text','Onest',system-ui,sans-serif; --f-body:'Golos Text','Onest',system-ui,sans-serif;
  color-scheme:dark;
}
:root[data-skin] .btn{background:var(--act);color:var(--act-ink);border-radius:8px;font-weight:500;letter-spacing:.01em}
:root[data-skin] .btn.quiet{background:transparent;color:var(--ink);border:1px solid var(--line)}
:root[data-skin] h1{font-weight:300;letter-spacing:-.02em}

/* demo-data note on test pages */
.demo{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px dashed var(--muted);border-radius:10px;padding:9px 12px;font-size:13px;color:var(--muted)}
.demo b{color:var(--ink);font-weight:500}

/* cockpit: E46-style dial, mini gauges, service-interval LEDs */
.cockpit{background:var(--lcd);border-radius:20px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px;color:var(--lcd-text);border:1px solid #1d1d20;box-shadow:inset 0 0 0 1px rgba(255,255,255,.03)}
.dial{display:block;width:100%;max-width:340px;margin:0 auto;overflow:visible}
.dial .tk{stroke:var(--glow);stroke-linecap:round}
.dial .tk.red{stroke:#FF2A1A}
.dial .num{fill:var(--glow);font:500 11px var(--f-mono);opacity:.85}
.dial .name{fill:var(--lcd-text);font:500 10px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;opacity:.75}
.dial .val{fill:var(--glow);font:500 21px var(--f-mono);letter-spacing:.01em}
.dial .needle{stroke:#FF7A3D;stroke-width:3;stroke-linecap:round;filter:drop-shadow(0 0 4px rgba(255,106,46,.7))}
.dial .hub{fill:#18181b;stroke:var(--chrome);stroke-width:1.5}
.dial .ring{fill:none;stroke:var(--chrome);stroke-width:2}
.sia{display:flex;justify-content:center;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px}
.sia i{width:9px;height:9px;border-radius:50%;background:#1d1d20;box-shadow:inset 0 0 0 1px #2a2a2e}
.sia i.g.on{background:#3BC46C;box-shadow:0 0 8px #3BC46C}
.sia i.y.on{background:#F2A63A;box-shadow:0 0 8px #F2A63A}
.sia i.r.on{background:#FF3B2A;box-shadow:0 0 8px #FF3B2A}
.sia span{font:500 10px var(--f-mono);letter-spacing:.16em;color:var(--lcd-text);opacity:.6;margin-left:6px;text-transform:uppercase}
.minis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.mini{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;text-align:center;background:none;border:0;color:inherit;padding:0}
.mini svg{width:100%;max-width:96px}
.mini b{font:500 12px var(--f-mono);color:var(--glow);white-space:nowrap}
.mini span{font-size:10.5px;color:var(--lcd-text);opacity:.7;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cockpit .lcd{padding:12px 16px;border-radius:12px;background:#0B0B0D;box-shadow:inset 0 0 0 1px #1f1f22}
.cockpit .lcd .digits{font-size:28px}
:root[data-skin="ab"] .cockpit{background:var(--surface);border-color:var(--line);border-radius:14px}
:root[data-skin="ab"] .cockpit .dial{max-width:250px}
:root[data-skin="ab"] .turn-ctl{margin-top:0}

/* "My BMW" service tiles (skin ab) */
.status-line{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:12px;padding:12px 14px;font-size:14px}
.status-line svg{width:20px;height:20px;flex:none}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border:0;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;text-align:left;color:inherit;min-width:0}
.tile:hover{background:var(--soft)}
.tile svg{width:34px;height:34px}
.tile .tn{font-size:13.5px;font-weight:500;line-height:1.25;min-width:0}
.tile .tv{font:500 12.5px var(--f-mono);color:var(--muted)}
.tile.s-late .tv{color:var(--late)} .tile.s-soon .tv{color:var(--soon)}
</style>

function spec(item, car){
  const base = {...item, ...(item.adjust ? item.adjust(car) || {} : {})};
  if (car.severe && base.severe && base.km) base.km = Math.round(base.km * 0.75 / 500) * 500;
  return base;
}
function itemsFor(car){ return ITEMS.filter(i => !i.when || i.when(car)).map(i => spec(i, car)); }

    }
  } while (again);
  writing = false;
}

// ================= helpers =================
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtKm = n => Math.round(n).toLocaleString('ru-RU');
const fmtRub = n => Math.round(n).toLocaleString('ru-RU') + ' ₽';
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fmtDate = s => parse(s).toLocaleDateString('ru-RU', {day:'2-digit', month:'2-digit', year:'numeric'});
const fmtMonth = d => d.toLocaleDateString('ru-RU', {month:'long', year:'numeric'}).replace(' г.', '');
// genitive month for "до …" / "не позже …": «октября 2026»
const fmtMonthGen = d => d.toLocaleDateString('ru-RU', {day:'numeric', month:'long', year:'numeric'}).replace(/^\d+\s/, '').replace(' г.', '');
const today = new Date(); today.setHours(0,0,0,0);
const addMonths = (d, n) => { const r = new Date(d); r.setMonth(r.getMonth() + n); return r; };
const plural = (n, a, b, c) => { n = Math.abs(n) % 100; const n1 = n % 10; return n > 10 && n < 20 ? c : n1 > 1 && n1 < 5 ? b : n1 === 1 ? a : c; };
const uid = () => Math.random().toString(36).slice(2, 10);
function interval(it){
  if (it.cond) return 'по состоянию';
  const p = [];
  if (it.km) p.push(`${fmtKm(it.km)} км`);
  if (it.mo) p.push(it.mo % 12 === 0 ? `${it.mo/12} ${plural(it.mo/12,'год','года','лет')}` : `${it.mo} мес.`);
  return p.join(' или ');
}
function carTitle(c){ const e = ENGINES[c.engine]; return `BMW ${e.models.split(' / ').length > 1 ? 'E46' : e.models}`; }

// km per month from odometer readings
function kmRate(){
  const o = (S.odo || []).slice().sort((a,b) => a.d < b.d ? -1 : 1);
  if (o.length < 2) return null;
  const a = o[0], b = o[o.length-1];
  const days = (parse(b.d) - parse(a.d)) / 864e5;
  if (days < 20 || b.km <= a.km) return null;
  return (b.km - a.km) / days * 30.4;
}

function status(it){
  const rec = S.rec[it.id];
  if (it.cond) return {state:'cond', pct:0, left: rec ? `меняли ${fmtDate(rec.d)}` : 'по состоянию', sub: rec ? `Меняли на ${fmtKm(rec.km)} км` : 'Следите за симптомами'};
  if (!rec) return {state:'none', pct:0, left:'нет данных', sub:'Отметьте, когда меняли'};
  const usedKm = Math.max(0, S.mileage - rec.km);
  const kmPct = it.km ? usedKm / it.km : 0;
  const due = it.mo ? addMonths(parse(rec.d), it.mo) : null;
  const moPct = due ? (today - parse(rec.d)) / (due - parse(rec.d)) : 0;
  const pct = Math.max(kmPct, moPct);
  const state = pct >= 1 ? 'late' : pct >= .85 ? 'soon' : 'ok';
  let left, eta = null;
  if (state === 'late') {
    left = kmPct >= 1 && it.km ? `просрочено на ${fmtKm(usedKm - it.km)} км` : 'срок вышел';
  } else if (it.km && kmPct >= moPct) {
    left = `через ${fmtKm(it.km - usedKm)} км`;
    const r = kmRate();
    if (r) { eta = addMonths(today, (it.km - usedKm) / r); if (due && eta > due) eta = due; }
  } else {
    left = `до ${fmtMonthGen(due)}`;
  }
  const sub = `Меняли ${fmtDate(rec.d)}` + (it.km ? ` на ${fmtKm(rec.km)} км` : '') +
    (eta && state !== 'late' ? ` · примерно ${fmtMonth(eta)}` : (it.km && due && state !== 'late' ? ` · не позже ${fmtMonthGen(due)}` : ''));
  return {state, pct:Math.min(pct,1), left, sub, eta, due};
}
const ORDER = {late:0, soon:1, none:2, ok:3, cond:4};

function row(it){
  const st = status(it);
  const bar = st.state === 'none' || st.state === 'cond' ? '' : `<div class="bar"><i style="width:${Math.max(4, st.pct*100).toFixed(0)}%"></i></div>`;
  return `<button class="row s-${st.state}" data-item="${it.id}">
    <span class="dot"></span><span class="name">${esc(it.name)}</span><span class="left">${esc(st.left)}</span>
    ${bar}<span class="sub">${esc(st.sub)}</span></button>`;
}

const VIEW_NAMES = ['спереди', 'спереди слева', 'слева', 'сзади слева', 'сзади', 'сзади справа', 'справа', 'спереди справа'];
let turnIdx = 2, turnSpun = false, turnTimer = null;
function carArt(c){
  return `<div class="art" data-turn-root role="img" aria-label="Чертёж машины: листайте, чтобы повернуть">
    <div class="turn-stage"><i class="turn-img"></i><i class="turn-img"></i></div>
    <div class="dim dim-a off"><span></span></div><div class="dim dim-b off"><span></span></div>
  </div>
  <div class="turn-ctl"><button data-turn="-1" aria-label="Повернуть назад">‹</button><span class="turn-name"></span><button data-turn="1" aria-label="Повернуть вперёд">›</button></div>
  <div class="turn-dots" aria-hidden="true">${VIEWS.map(() => '<i></i>').join('')}</div>`;
}
function showView(root, idx){
  const c = (S && S.car) || {};
  const m3 = c.engine === 's54';
  const len = m3 ? 4492 : LENGTH[c.body || 'sedan'], wb = m3 ? 2731 : 2725, width = m3 ? 1780 : 1739;
  const v = VIEWS[idx], layers = root.querySelectorAll('.turn-img');
  const next = root.dataset.layer === '0' ? 1 : 0; root.dataset.layer = next;
  layers[next].style.setProperty('--m', `url(${v.m})`);
  layers[next].classList.add('on'); layers[1 - next].classList.remove('on');
  const a = root.querySelector('.dim-a'), b = root.querySelector('.dim-b');
  const place = (el, l, r, label) => { el.style.left = l + '%'; el.style.right = (100 - r) + '%'; el.querySelector('span').textContent = label; el.classList.remove('off'); };
  if (v.w) { place(a, v.w[0], v.w[1], `база ${fmtKm(wb)}`); place(b, v.b[0], v.b[1], `длина ${fmtKm(len)} мм`); }
  else if (idx === 0 || idx === 4) { a.classList.add('off'); place(b, v.b[0], v.b[1], `ширина ${fmtKm(width)} мм`); }
  else { a.classList.add('off'); b.classList.add('off'); }
  const wrap = root.parentNode;
  const name = wrap.querySelector('.turn-name'); if (name) name.textContent = VIEW_NAMES[idx];
  wrap.querySelectorAll('.turn-dots i').forEach((d, k) => d.classList.toggle('on', k === idx));
}
function turn(step){
  turnIdx = (turnIdx + step + VIEWS.length) % VIEWS.length;
  document.querySelectorAll('[data-turn-root]').forEach(r => showView(r, turnIdx));
}
function stopSpin(){ clearInterval(turnTimer); turnTimer = null; turnSpun = true; }
function mountTurns(){
  const roots = document.querySelectorAll('[data-turn-root]');
  if (!roots.length) return;
  roots.forEach(root => {
    root.dataset.layer = '1'; showView(root, turnIdx);
    let x0 = null, acc = 0;
    root.addEventListener('pointerdown', e => { x0 = e.clientX; acc = 0; stopSpin(); });
    root.addEventListener('pointermove', e => {
      if (x0 === null) return;
      acc += e.clientX - x0; x0 = e.clientX;
      const step = Math.max(28, root.clientWidth / 14);
      while (Math.abs(acc) >= step) { turn(acc < 0 ? 1 : -1); acc -= Math.sign(acc) * step; }
    });
    const end = () => { x0 = null; };
    root.addEventListener('pointerup', end); root.addEventListener('pointercancel', end); root.addEventListener('pointerleave', end);
  });
  // one slow presentation lap on first view, ending on the side profile
  if (!turnSpun && !turnTimer && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    let left = VIEWS.length;
    turnTimer = setInterval(() => { if (document.hidden) return; turn(1); if (--left <= 0) stopSpin(); }, 900);
  }
}
function vinCard(v){
  if (!v) return `<p class="note">Введите VIN, и модель, мотор, кузов, привод и год подставятся сами. Коробку VIN не показывает, её выберите ниже.</p>`;
  if (v.error) return `<p class="err">${esc(v.error)}</p>`;
  const built = v.from ? `${v.from.replace('-', '.').split('.').reverse().join('.')} – ${v.to.replace('-', '.').split('.').reverse().join('.')}` : '';
  return `<div class="vin-card">
    <b>BMW ${esc(v.model)} · ${esc(BODIES[v.bodyKey])}</b>
    <dl class="kv">
      <dt>Мотор</dt><dd>${esc(v.engineName)}, ${v.hp} л.с. (${v.kw} кВт)</dd>
      <dt>Привод</dt><dd>${v.awd ? 'полный (xDrive)' : 'задний'}</dd>
      <dt>Рынок</dt><dd>${esc(VIN_REGION[v.region] || v.region)}</dd>
      ${built ? `<dt>Выпуск</dt><dd>${built}${v.year ? `, ваша — ${v.year} модельного года` : ''}</dd>` : ''}
      <dt>Код типа</dt><dd class="num">${esc(v.type)}</dd>
    </dl></div>`;
}
function applyVin(v){
  const f = $('#setup'); if (!f || !v || v.error) return;
  f.engine.value = v.engine; f.body.value = v.bodyKey; f.xdrive.checked = v.awd;
  if (v.year) f.year.value = v.year;
  else if (v.from && (+f.year.value < +v.from.slice(0,4) || +f.year.value > +v.to.slice(0,4))) f.year.value = v.from.slice(0,4);
  if (v.engine !== 's54' && f.gearbox.value === 'smg') f.gearbox.value = 'manual';
}

const polar = (cx, cy, r, deg) => [cx + r * Math.cos(deg * Math.PI / 180), cy - r * Math.sin(deg * Math.PI / 180)];
function arcPath(cx, cy, r, d0, d1){
  const [x0, y0] = polar(cx, cy, r, d0), [x1, y1] = polar(cx, cy, r, d1);
  const large = Math.abs(d0 - d1) > 180 ? 1 : 0;
  return `M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 ${large} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;
}
// Big dial: 240° sweep like the E46 rev counter, red zone from 85 % of the interval
function dialSVG(t, name, value){
  const cx = 150, cy = 150, R = 118, ang = v => 210 - 240 * v;
  let ticks = '';
  for (let i = 0; i <= 40; i++) {
    const v = i / 40, major = i % 4 === 0, r1 = major ? R - 14 : R - 7;
    const [x0, y0] = polar(cx, cy, R, ang(v)), [x1, y1] = polar(cx, cy, r1, ang(v));
    ticks += `<line class="tk${v >= 0.85 ? ' red' : ''}" x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" stroke-width="${major ? 2.4 : 1.2}"/>`;
  }
  let nums = '';
  for (const v of [0, .25, .5, .75, 1]) { const [x, y] = polar(cx, cy, R - 30, ang(v)); nums += `<text class="num" x="${x.toFixed(1)}" y="${(y + 4).toFixed(1)}" text-anchor="middle">${Math.round(v * 100)}</text>`; }
  const [nx, ny] = polar(cx, cy, R - 20, ang(Math.min(Math.max(t, 0), 1.04)));
  return `<svg class="dial" viewBox="0 0 300 222" role="img" aria-label="${esc(name)}: ${esc(value)}">
    <path class="ring" d="${arcPath(cx, cy, R + 6, 212, -32)}"/>${ticks}${nums}
    <text class="name" x="150" y="96" text-anchor="middle">${esc(name)}</text>
    <text class="val" x="150" y="124" text-anchor="middle">${esc(value)}</text>
    <line class="needle" x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}"/>
    <circle class="hub" cx="${cx}" cy="${cy}" r="9"/>
    <text class="name" x="150" y="206" text-anchor="middle" style="font-size:9px">% ресурса</text></svg>`;
}
function miniSVG(t, state){
  const col = state === 'late' ? 'var(--late)' : state === 'soon' ? 'var(--soon)' : 'var(--glow)';
  const v = Math.min(Math.max(t, 0), 1), d = 180 - 180 * v;
  const [nx, ny] = polar(50, 56, 30, d);
  return `<svg viewBox="0 0 100 64" aria-hidden="true">
    <path d="${arcPath(50, 56, 40, 180, 0)}" fill="none" stroke="#232326" stroke-width="5" stroke-linecap="round"/>
    ${v > 0.01 ? `<path d="${arcPath(50, 56, 40, 180, d)}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round"/>` : ''}
    <line x1="50" y1="56" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="#FF7A3D" stroke-width="2" stroke-linecap="round"/>
    <circle cx="50" cy="56" r="4" fill="#18181b" stroke="var(--chrome)"/></svg>`;
}
// E46 service interval indicator: five green LEDs go out as the interval is used, then yellow, then red
function siaHTML(top){
  const st = top ? top.st.state : 'none', pct = top ? top.st.pct : 0;
  const greens = st === 'ok' ? Math.max(1, Math.ceil(5 * (1 - pct / 0.85))) : 0;
  const label = st === 'late' ? 'Сервис просрочен' : st === 'soon' ? 'Скоро сервис' : st === 'ok' ? 'Сервис в норме' : 'Нет данных';
  return `<div class="sia" aria-label="${label}">${[0,1,2,3,4].map(k => `<i class="g${k < greens ? ' on' : ''}"></i>`).join('')}<i class="y${st === 'soon' ? ' on' : ''}"></i><i class="r${st === 'late' ? ' on' : ''}"></i><span>${label}</span></div>`;
}
function cockpitHTML(items, opts){
  const tracked = items.filter(x => x.st.state !== 'cond' && x.st.state !== 'none').sort((a, b) => b.st.pct - a.st.pct);
  // the big dial is an odometer-driven gauge: the most used-up item that has a km interval; minis show the next most urgent
  const top = tracked.find(x => x.it.km) || tracked[0];
  const rest = tracked.filter(x => x !== top);
  const digits = String(Math.round(S.mileage)).padStart(6, '0'), lead = digits.match(/^0*/)[0].length;
  const short = x => x.st.state === 'late' && !/км/.test(x.st.left) ? 'срок вышел'
    : /^до /.test(x.st.left) && x.st.due ? x.st.due.toLocaleDateString('ru-RU', {month:'short', year:'numeric'}).replace(' г.', '')
    : x.st.left.replace(/^через /, '').replace(/^просрочено на /, '−');
  return `<div class="cockpit">
    ${dialSVG(top ? top.st.pct : 0, top ? top.it.name.replace(/ и фильтр$/, '').slice(0, 28) : 'Отметьте замены', top ? short(top) : '—')}
    ${siaHTML(top)}
    ${opts.minis && rest.length ? `<div class="minis">${rest.slice(0, 3).map(x => `<button class="mini" data-item="${x.it.id}">${miniSVG(x.st.pct, x.st.state)}<b>${esc(short(x))}</b><span>${esc(x.it.name)}</span></button>`).join('')}</div>` : ''}
    <button class="lcd" data-act="mileage" aria-label="Обновить пробег">
      <span class="lbl">ODO</span>
      <span class="digits"><span class="lead">${digits.slice(0, lead)}</span>${digits.slice(lead)}</span><span class="unit">km</span>
      <span class="hint">обновить →</span></button>
  </div>`;
}
function ringSVG(t, state){
  const col = state === 'late' ? 'var(--late)' : state === 'soon' ? 'var(--soon)' : 'var(--act)';
  const c = 2 * Math.PI * 15, v = Math.min(Math.max(t, 0), 1);
  return `<svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15" fill="none" stroke="var(--soft)" stroke-width="3.2"/>
    <circle cx="18" cy="18" r="15" fill="none" stroke="${col}" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="${(c * v).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 18 18)"/></svg>`;
}

function firstSentence(s){ const m = String(s).match(/^.*?[.!?](\s|$)/); return (m ? m[0] : s).trim(); }
function nextService(items){
  const r = kmRate() || 1500;
  return items.filter(x => {
    const it = x.it, rec = S.rec[it.id];
    if (it.cond || !rec) return false;
    if (x.st.state === 'late' || x.st.state === 'soon') return true;
    const kmLeft = it.km ? it.km - (S.mileage - rec.km) : Infinity;
    const due = it.mo ? addMonths(parse(rec.d), it.mo) : null;
    return kmLeft <= Math.max(3000, r*3) || (due && due <= addMonths(today, 3));
  });
}

function viewLog(){
  const log = (S.log || []).slice().sort((a,b) => a.d < b.d ? 1 : a.d > b.d ? -1 : b.km - a.km);
  const total = log.reduce((s,x) => s + (x.cost||0), 0);
  const y = String(today.getFullYear());
  const year = log.filter(x => x.d.startsWith(y)).reduce((s,x) => s + (x.cost||0), 0);
  const rate = kmRate();
  return `<section class="section">
    <div class="section-head"><div><p class="eyebrow">Сервисная история</p><h1>Журнал</h1></div>
      <button class="btn" data-act="add-entry">Добавить</button></div>
    <div class="stats">
      <div class="stat"><b>${fmtRub(year)}</b><span>за ${y} год</span></div>
      <div class="stat"><b>${fmtRub(total)}</b><span>всего</span></div>
      <div class="stat"><b>${rate ? fmtKm(rate) : '—'}</b><span>км в месяц</span></div>
    </div>
    <div class="list">${log.length ? log.map(x => `<button class="entry" data-entry="${x.id}">

  ${STANDALONE ? `<section class="section"><h2>Резервная копия</h2>

      <label class="f" for="e-cost">Стоимость, ₽<input id="e-cost" class="num" name="cost" type="number" min="0" inputmode="numeric" value="${x.cost||''}" placeholder="0"></label>

function rebuildRecords(){
  const rec = {};
  for (const x of (S.log||[]).slice().sort((a,b) => a.d < b.d ? -1 : 1)) for (const id of (x.items||[])) rec[id] = {km:x.km, d:x.d};
  S.rec = rec;
}

function sheetMileage(){
  openSheet(`<div class="sheet-head"><div><p class="eyebrow">Одометр</p><h3>Текущий пробег</h3></div><button class="x" data-act="close" aria-label="Закрыть">×</button></div>
    <form id="mileage"><label class="f" for="m-km">Пробег, км<input id="m-km" class="num" name="km" type="number" min="0" inputmode="numeric" value="${S.mileage}" required></label>
    <p class="note">Обновляйте раз в неделю-две: по этим отметкам журнал считает ваш средний пробег и даты ближайших замен.</p>

function render(){
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'));
  $('nav.tabs').hidden = !S || editing;
  if (!ready) { $('#app').innerHTML = '<p class="loading">Открываю бортжурнал…</p>'; return; }
  if (!S || editing) { $('#app').innerHTML = viewSetup(editing); mountTurns(); return; }
  const keepQ = $('#ask-q') ? $('#ask-q').value : '';
  const keepA = $('#ask-out') && !$('#ask-out').hidden ? $('#ask-out').textContent : '';
  $('#app').innerHTML = {home:SKIN ? viewHomeSkin : viewHome, parts:viewParts, car:viewCar, log:viewLog}[tab]();
  mountTurns();
  if (tab === 'car') { if ($('#ask-q')) $('#ask-q').value = keepQ; if (keepA) { $('#ask-out').hidden = false; $('#ask-out').textContent = keepA; } }
}
function go(t){ tab = t; try { localStorage.setItem(LKEY+':tab', t); } catch(e) {} history.replaceState(null, '', '#'+t); render(); window.scrollTo(0,0); }

document.addEventListener('click', ev => {
  const t = ev.target.closest('button, #scrim'); if (!t) return;
  if (t.id === 'scrim' || t.dataset.act === 'close') return closeSheet();
  if (t.dataset.turn) { stopSpin(); return turn(+t.dataset.turn); }
  if (t.dataset.tab) return go(t.dataset.tab);
  if (t.dataset.goto) return go(t.dataset.goto);
  if (t.dataset.filter) { partFilter = t.dataset.filter; return render(); }
  if (t.dataset.item) return sheetItem(t.dataset.item);
  if (t.dataset.q) { $('#ask-q').value = t.dataset.q; return ask(); }
  if (t.dataset.entry) {
    const x = S.log.find(e => e.id === t.dataset.entry); if (!x) return;
    return openSheet(`<div class="sheet-head"><div><p class="eyebrow">Запись журнала</p><h3>${esc(x.title)}</h3></div><button class="x" data-act="close" aria-label="Закрыть">×</button></div>` + entryForm(x));
  }
  switch (t.dataset.act) {
    case 'edit-car': editing = true; render(); window.scrollTo(0,0); break;
    case 'cancel-edit': editing = false; render(); break;
    case 'mileage': sheetMileage(); break;
    case 'add-entry': openSheet(`<div class="sheet-head"><div><p class="eyebrow">Журнал</p><h3>Новая запись</h3></div><button class="x" data-act="close" aria-label="Закрыть">×</button></div>` + entryForm()); break;
    case 'mark': {
      const it = itemsFor(S.car).find(x => x.id === t.dataset.id);
      openSheet(`<div class="sheet-head"><div><p class="eyebrow">Отметить замену</p><h3>${esc(it.name)}</h3></div><button class="x" data-act="close" aria-label="Закрыть">×</button></div>` + entryForm({d:iso(today), km:S.mileage, items:[it.id], title:it.name, quick:true}));
      break;
    }
    case 'del-entry': {
      if (t.dataset.confirm !== '1') { t.dataset.confirm = '1'; t.textContent = 'Нажмите ещё раз, чтобы удалить'; return; }
      S.log = S.log.filter(e => e.id !== t.dataset.id); rebuildRecords(); save(); closeSheet(); render(); break;
    }
    case 'ask': ask(); break;
    case 'gkey-save': {
      // keep whatever Google issued: only strip spaces, line breaks and quotes picked up while copying
      const k = ($('#gkey').value || '').replace(/\s+/g, '').replace(/^["'«]+|["'»]+$/g, ''), e = $('#gkey-err');
      if (k.length < 20) { e.hidden = false; e.textContent = 'Ключ слишком короткий. Скопируйте его целиком кнопкой копирования рядом с ключом в AI Studio.'; return; }
      try { localStorage.setItem(GKEY, k); } catch (err) { e.hidden = false; e.textContent = 'Телефон не дал сохранить ключ. Отключите приватный режим браузера.'; return; }
      render(); checkGeminiKey(); break;
    }
    case 'gkey-reset': try { localStorage.removeItem(GKEY); } catch (err) {} render(); break;
    case 'export': exportBackup(); break;
    case 'exit-demo': exitDemo(); break;
    case 'enter-demo': enterDemo(); render(); break;
    case 'import': $('#import-file').click(); break;
    case 'do-import': if (pendingImport) { S = pendingImport; pendingImport = null; save(); closeSheet(); go('home'); } break;
  }
});

document.addEventListener('submit', ev => {
  ev.preventDefault();
  const f = ev.target, fd = new FormData(f);
  if (f.id === 'setup') {
    const car = {engine:fd.get('engine'), gearbox:fd.get('gearbox'), body:fd.get('body'), year:+fd.get('year'),
      vin:String(fd.get('vin')||'').trim().toUpperCase(), xdrive:!!fd.get('xdrive'), severe:!!fd.get('severe')};
    if (car.xdrive && !['m54','m57'].includes(car.engine)) car.xdrive = false;
    const v = car.vin ? decodeVin(car.vin) : null;
    if (v && !v.error && v.engine === car.engine) Object.assign(car, {model:v.model, engineName:v.engineName, hp:v.hp, type:v.type, region:v.region, built:v.from ? v.from + '/' + v.to : ''});
    const km = Math.round(+fd.get('mileage'));
    if (!S) S = {car, mileage:km, odo:[{d:iso(today), km}], rec:{}, log:[]};
    else { S.car = car; if (km !== S.mileage) { S.mileage = km; pushOdo(km); } }
    editing = false; save(); go('home'); return;
  }
  if (f.id === 'mileage') {
    const km = Math.round(+fd.get('km'));
    const maxLog = Math.max(0, ...(S.log||[]).map(x => x.km));
    if (km < maxLog) { const e = $('#m-err'); e.hidden = false; e.textContent = `Пробег меньше, чем в последней записи журнала (${fmtKm(maxLog)} км). Проверьте цифры.`; return; }
    S.mileage = km; pushOdo(km); save(); closeSheet(); render(); return;
  }
  if (f.id === 'entry') {
    const items = fd.getAll('items').filter(Boolean);
    const all = itemsFor(S.car);
    const d = fd.get('d'), km = Math.round(+fd.get('km'));
    if (parse(d) > today) { const e = $('#e-err'); e.hidden = false; e.textContent = 'Дата не может быть в будущем.'; return; }
    let title = String(fd.get('title') || '').trim();
    if (!title) title = items.length ? items.map(id => (all.find(x => x.id === id) || {}).name).filter(Boolean).join(', ') : 'Ремонт';
    const x = {id: f.dataset.eid || uid(), d, km, items, title, cost: Math.round(+fd.get('cost') || 0), note: String(fd.get('note')||'').trim()};
    S.log = (S.log||[]).filter(e => e.id !== x.id).concat(x);
    rebuildRecords();
    if (km > S.mileage) { S.mileage = km; }
    pushOdo(km, d);
    save(); closeSheet(); render(); return;
  }
});

function pushOdo(km, d){
  d = d || iso(today);
  S.odo = (S.odo || []).filter(o => o.d !== d);
  S.odo.push({d, km});
  S.odo.sort((a,b) => a.d < b.d ? -1 : 1);
  if (S.odo.length > 120) S.odo = S.odo.slice(-120);
}

// ---- Google Gemini (phone version): the owner's own key, kept only in this browser ----
const GKEY = 'e46-gemini-key';
function gKey(){ try { return localStorage.getItem(GKEY) || ''; } catch (e) { return ''; } }
function aiMode(){ return sample ? 'claude' : STANDALONE ? 'gemini' : null; }
async function askGemini(prompt, signal){
  let last = '';
  for (const model of ['gemini-flash-latest', 'gemini-2.5-flash']) {
    for (const search of [true, false]) {
      const body = {contents: [{role: 'user', parts: [{text: prompt}]}]};
      if (search) body.tools = [{google_search: {}}];
      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
        method: 'POST', signal, headers: {'Content-Type': 'application/json', 'x-goog-api-key': gKey()}, body: JSON.stringify(body)});
      const j = await r.json().catch(() => ({}));
      if (r.ok) {
        const text = ((j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts) || []).map(p => p.text || '').join('').trim();
        if (text) return text.replace(/\*\*/g, '').replace(/^#+\s*/gm, '').replace(/^\* /gm, '- ');
        last = 'empty'; continue;
      }
      const msg = (j.error && j.error.message) || '';
      if (/location is not supported|User location/i.test(msg)) throw {code: 'geo'};
      if (/API key not valid|API_KEY_INVALID|API key expired|invalid authentication credentials|UNAUTHENTICATED/i.test(msg)) throw {code: 'key'};
      if (r.status === 404) { last = msg; break; }            // model name not available: try the next one
      if (search) { last = msg; continue; }                   // search grounding refused or over quota: retry plain
      if (r.status === 429) throw {code: 'rate'};
      throw {code: 'other', msg};
    }
  }
  throw {code: 'other', msg: last};
}

// right after saving: ask Google whether the key works and say so under the question box
async function checkGeminiKey(){
  const out = $('#ask-out'); if (!out) return;
  out.hidden = false; out.textContent = 'Проверяю ключ у Google…';
  try {
    const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=1', {headers: {'x-goog-api-key': gKey()}});
    const j = await r.json().catch(() => ({}));
    const msg = (j.error && j.error.message) || '';
    out.textContent = r.ok ? 'Ключ работает. Задавайте вопрос.'
      : /location is not supported|User location/i.test(msg) ? 'Ключ сохранён, но Google не отвечает из вашей страны. Включите VPN и задайте вопрос.'
      : /API key not valid|API_KEY_INVALID|expired|invalid authentication credentials|UNAUTHENTICATED/i.test(msg) ? 'Google говорит, что ключ неверный. Нажмите «Сменить ключ» и вставьте его заново целиком.'
      : 'Ключ сохранён, но проверить его не удалось' + (msg ? ` (${msg})` : '') + '. Попробуйте задать вопрос.';
  } catch (err) {
    out.textContent = 'Ключ сохранён, но до Google не достучаться. Включите VPN и задайте вопрос.';
  }
}

async function ask(){
  const mode = aiMode(); if (!mode) return;
  const q = $('#ask-q').value.trim(); if (!q) { $('#ask-q').focus(); return; }
  if (asking) asking.abort();
  asking = new AbortController();
  const out = $('#ask-out'), btn = $('#ask-btn');
  out.hidden = false; out.textContent = 'Думаю…'; btn.disabled = true;
  const c = S.car, e = ENGINES[c.engine];
  const lines = itemsFor(c).map(it => { const st = status(it); return `- ${it.name} (интервал: ${interval(it)}): ${st.left}; ${st.sub}`; }).join('\n');
  const recent = (S.log||[]).slice().sort((a,b) => a.d < b.d ? 1 : -1).slice(0, 15).map(x => `- ${x.d}, ${x.km} км: ${x.title}${x.note ? ' ('+x.note+')' : ''}`).join('\n');
  const prompt = `Ты опытный мастер по BMW E46, отвечаешь владельцу по-русски, коротко и по делу, без markdown-разметки (без звёздочек и решёток), списки через дефис.
Машина: BMW E46 ${c.model || e.models}, мотор ${c.engineName || e.code}${c.hp ? ', ' + c.hp + ' л.с.' : ''}${c.vin ? ', VIN ' + c.vin : ''} (${e.vol}, ${e.fuel==='diesel'?'дизель':'бензин'}), ${GEARBOX[c.gearbox]}, кузов ${BODIES[c.body]}, ${c.year} год${c.xdrive?', полный привод':''}. Пробег ${S.mileage} км. Сегодня ${iso(today)}. Россия${c.severe?', тяжёлые условия эксплуатации':''}.
Состояние расходников:
${lines}
Последние записи журнала:
${recent || '- нет'}

Вопрос владельца: ${q}`;
  if (mode === 'gemini') {
    try { out.textContent = await askGemini(prompt, asking.signal); }
    catch (err) {
      if (err && err.name === 'AbortError') return;
      out.textContent = !err || err.name === 'TypeError' ? 'Нет связи с Google. Проверьте интернет и включите VPN — из России Google ИИ не отвечает.'
        : err.code === 'geo' ? 'Google не отвечает из вашей страны. Включите VPN и спросите ещё раз.'
        : err.code === 'key' ? 'Ключ Google AI не подходит. Нажмите «Сменить ключ» и вставьте новый.'
        : err.code === 'rate' ? 'Бесплатный лимит вопросов на сейчас исчерпан. Попробуйте через минуту или завтра.'
        : 'Не получилось получить ответ. Попробуйте ещё раз.';
    } finally { btn.disabled = false; }
    return;
  }
  try {
    const r = await sample(prompt, {signal: asking.signal, cache:false, onText: ({text}) => { out.textContent = text || 'Думаю…'; }});
    out.textContent = r.text;
  } catch(err) {
    if (err && err.name === 'AbortError') return;
    out.textContent = err && err.code === 'not_granted' ? 'Доступ к Claude не разрешён на этой странице.' : err && err.code === 'rate_limited' ? 'Слишком много вопросов подряд. Попробуйте через минуту.' : 'Не получилось получить ответ. Попробуйте ещё раз.';
    if (err && err.code === 'not_granted') { sample = null; }
  } finally { btn.disabled = false; }
}

// ================= boot =================
async function boot(){
  const local = loadLocal();
  if (!window.claude || !window.claude.use) { S = local; if (SKIN && (!S || Object.keys(S.rec || {}).length < 3)) enterDemo(); ready = true; render(); return; }
  render();
  const [d, s] = await Promise.all([window.claude.use('db').catch(() => null), window.claude.use('sample').catch(() => null)]);
  sample = s;
  if (!d) { S = local; ready = true; render(); return; }
  db = d; docRef = db.doc(DOC);
  let first = true;
  docRef.onSnapshot(snap => {
    const data = snap.exists ? snap.data() : null;
    if (first) {
      first = false; ready = true;
      if (data && data.car) S = JSON.parse(JSON.stringify(data));
      else if (local) { S = local; save(); }
      else S = null;
      if (S) saveLocal();
      render(); return;
    }
    if (data && data.car && (!S || data.updated !== S.updated) && !writing) {
      S = JSON.parse(JSON.stringify(data)); saveLocal();
      if ($('#sheet').hidden && !editing) render();
    }
  }, err => { if (!ready) { S = local; ready = true; render(); } });
  setTimeout(() => { if (!ready) { S = local; ready = true; render(); } }, 8000);
}
boot();
})();
